[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.142.2",
    "google-auth>=2.60.0",
    "grpcio>=1.84.0",
    "langgraph>=1.2.14",
    "openai>=3.24.0",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
